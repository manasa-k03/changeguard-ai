# Render deployment configuration — Backend only
# Frontend is deployed to Vercel (see frontend/vercel.json)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: changeguard-ai-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is intentionally omitted — Render injects it automatically
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Set these manually in the Render dashboard after deploying:
      # OPENAI_API_KEY  — your OpenAI key (omit to run in demo mode)
      # FRONTEND_URL    — your Vercel frontend URL, e.g. https://changeguard-ai.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DB_PATH
        value: ./data/changeguard.db
